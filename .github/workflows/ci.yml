name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────
  # Job 1: Build & Unit Tests (model + application)
  # ─────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests (model + application)
        run: mvn clean test -pl model,application -B

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            model/target/surefire-reports/
            application/target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────────
  # Job 2: Integration Tests (adapter + bootstrap)
  # ─────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run integration tests
        run: mvn clean verify -B

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            adapter/target/surefire-reports/
            bootstrap/target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────────
  # Job 3: Coverage Report
  # ─────────────────────────────────────────────────
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with coverage
        run: mvn clean verify -B

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            model/target/site/jacoco/
            application/target/site/jacoco/
            adapter/target/site/jacoco/
            bootstrap/target/site/jacoco/
          retention-days: 14

      - name: Add coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: |
            model/target/site/jacoco/jacoco.xml,
            application/target/site/jacoco/jacoco.xml,
            adapter/target/site/jacoco/jacoco.xml,
            bootstrap/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 60
          min-coverage-changed-files: 80
          title: "Code Coverage Report"
          update-comment: true

  # ─────────────────────────────────────────────────
  # Job 4: Architecture Tests
  # ─────────────────────────────────────────────────
  architecture-tests:
    name: Architecture Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install dependencies (skip tests)
        run: mvn clean install -DskipTests -B

      - name: Run ArchUnit tests
        run: mvn test -pl bootstrap -Dtest="**/archunit/**" -B
